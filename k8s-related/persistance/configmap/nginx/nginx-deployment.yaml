apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app
spec:
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
        - name: nginx-app
          image: nginx:stable-alpine3.23-perl
          ports:
            - containerPort: 80
          volumeMounts:
            - name: my-vol
              mountPath: /usr/share/nginx/html
      volumes:
        - name: my-vol
          configMap:
            name: nginx-index-configmap
            items:
              - key: index.html
                path: index.html
