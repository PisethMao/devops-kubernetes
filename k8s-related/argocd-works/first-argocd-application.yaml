apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: first-argocd-declarative-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PisethMao/deploy-project-with-argocd.git
    targetRevision: HEAD
    path: launchly-project
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - Validate = false