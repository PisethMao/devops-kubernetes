replicaCount: 1
image:
  repository: 69966/earthdx
  pullPolicy: IfNotPresent
  tag: "78"
imagePullSecrets: []
nameOverride: ""
fullnameOverride: "reactjs-earthdx"
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "lets-encrypt-prod"
  hosts:
    - host: test-helm.piseth.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: test-helm-tls
      hosts:
        - test-helm.piseth.dev
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers
resources: {}
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
